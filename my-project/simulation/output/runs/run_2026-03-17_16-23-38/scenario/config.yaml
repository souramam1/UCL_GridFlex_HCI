concordia:
  total_steps: 10
  model:
    default_model: openai/gpt-5-mini
    openrouter:
      reasoning:
        text: minimal
        choice: low
      include_reasoning: false
      max_tokens: 2000
  scenes:
    include_negotiation: true
    operation_steps: 5
    negotiation_steps: 6
    operation_premise: The grid is operating. Decide whether to charge your EV now.
    negotiation_premise: The grid is congested. Negotiate with the other agents about
      who should charge and who should wait.
  scene_descriptions:
    start_time: '2026-01-15T21:00:00'
    time_steps_hrs: 0.5
    day_of_week: Weekday
    month: JAN
  observation_visibility:
    tariff: false
    co2: false
    grid_status: false
    bus_voltage: false
    charging_history: false
    neighbors_charging: false
  agent:
    archetypes:
      archetype_1:
        num_copies: 2
        include_rationale: false
        include_decision_reasoning: true
        include_negotiation_summary: true
        cooperative: true
        model:
          model_name: openai/gpt-5-mini
          openrouter:
            reasoning:
              text: minimal
              choice: low
            include_reasoning: false
            max_tokens: 2000
        prompts:
          guiding_principle: ''
        initial_soc_pct: 20.0
        target_soc_pct: 60.0
        departure_time: 07:00
        ev_connected_time: '21:00'
        battery_capacity_kwh: 35.0
        ev_charger_kw: 3
        cluster_label: null
        energy_rating: A_B_C
        property_type_2: null
        tariff_type: null
      archetype_2:
        num_copies: 1
        include_rationale: false
        include_decision_reasoning: true
        include_negotiation_summary: true
        cooperative: true
        model:
          model_name: anthropic/claude-sonnet-4.6
          openrouter:
            reasoning:
              text: low
              choice: low
            include_reasoning: false
            max_tokens: 2000
        prompts:
          guiding_principle: ''
        initial_soc_pct: 40.0
        target_soc_pct: 80.0
        departure_time: 08:00
        ev_connected_time: '22:00'
        battery_capacity_kwh: 60.0
        ev_charger_kw: 7
        cluster_label: null
        energy_rating: null
        property_type_2: null
        tariff_type: null
  gm:
    negotiation_enabled: true
simulation:
  live_output:
    enabled: false
    path: output/simulation_live.jsonl
    dashboard_port: 8080
  structured_output:
    enabled: true
    base_dir: data\runs
    path: null
  pandapower:
    network: village_1
    trafo_sn_mva: 0.02
project_constants:
  demand_profiles:
    enabled: false
    parquet_path: null
    csv_fallback_path: null
    csv_fallback_archetype: null
    seed: 42
    scaling_factor: 1.0
